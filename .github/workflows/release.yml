# kics-scan disable=baee238e-1921-4801-9c3f-79ae1d7b2cbc
name: Release

# Diatreme release workflow (org template). Detects the Dockerfile -> on PRs it
# builds+pushes a pr-<N> image (verify before merge); on push to main it versions,
# releases, and promotes the image to ghcr.io/magmamoose/github-timesheet.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - docs/**
      - LICENSE
      - .gitignore
  workflow_dispatch:

permissions:
  contents: write     # version bump + tag on release
  id-token: write     # OIDC for the Diatreme token broker
  packages: write     # push the image to GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diatreme:
    runs-on: ${{ vars.SELFHOSTED_GITHUB_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        shell: bash
        run: |
          if [ -f docker-bake.hcl ] || [ -f Dockerfile ]; then
            echo "image_name=${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_name=" >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name == 'pull_request' && steps.detect.outputs.image_name != ''
        uses: magmamoose/diatreme@453fc82a4c0bd0dd90d868c7e04266f2da7ca4e9 # v2.6.0
        with:
          mode: ci
          image_name: ${{ steps.detect.outputs.image_name }}
      - if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: magmamoose/diatreme@453fc82a4c0bd0dd90d868c7e04266f2da7ca4e9 # v2.6.0
        with:
          mode: release
          versioning-tool: gitversion
          environment: prod
          environments: '["prod"]'
          prerelease-identifiers: '{}'
          image_name: ${{ steps.detect.outputs.image_name }}
