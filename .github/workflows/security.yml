# Code scanning and dependency review.
#
# Both jobs are gated on the repository being PUBLIC, and the gate is real: on a
# private repository outside GitHub Advanced Security, CodeQL cannot upload its
# SARIF ("Resource not accessible by integration") and dependency review is
# refused outright. Skipping is honest; `continue-on-error` would paint a job
# green that never ran.
#
# There is deliberately no secret-scanning job here. GitHub's own secret scanning
# and push protection are free on public repositories, run on every push, and
# block a commit before the secret lands — which no CI job can do. Turn both on
# under Settings -> Code security once this repository is public.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, because a dependency becomes vulnerable long after it was merged
    # and nothing in a quiet repository would otherwise notice.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  dependency-review:
    # PRs only: it compares the base against the head, so there is nothing to
    # diff on a push to main.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  chargate:
    # Net-new security findings on the pull request's own diff. Unlike CodeQL
    # this needs no Advanced Security, so it runs whatever the repo visibility.
    # It checks out with fetch-depth: 0 itself — the merge-base is what "net-new"
    # is measured against, and a shallow clone fails loudly rather than passing
    # silently.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # the findings comment
      security-events: write   # SARIF to the Security tab
    steps:
      - uses: magmamoose/chargate@c4de649b91341eff4e1b7871af6db3bd0fcdf541 # v2.11.57
        with:
          fail_on: high        # block on net-new high/critical, not on the backlog
