apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gts.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gts.labels" . | nindent 4 }}
data:
  # Non-secret runtime config. Secrets (DATABASE_URL, M365_ICS_URL,
  # M365_MCP_TOKEN_JSON, GHE_TOKEN, INGEST_TOKEN, SMTP_PASSWORD, …) come from
  # the -env Secret, not here.
  TZ: {{ .Values.config.tz | quote }}
  {{- with .Values.config.m365Source }}
  M365_SOURCE: {{ . | quote }}
  {{- end }}
  M365_MCP_TOKEN_CACHE: {{ .Values.config.m365McpTokenCache | quote }}
  DAY_START: {{ .Values.config.dayStart | quote }}
  ROTA_ENABLED: {{ .Values.config.rotaEnabled | quote }}
  ROTA_MINUTES: {{ .Values.config.rotaMinutes | quote }}
  INCLUDE_AFTER_HOURS: {{ .Values.config.includeAfterHours | quote }}
  # AI label polish (optional). Empty model => deterministic summaries. Key comes
  # from the -env Secret (LITELLM_API_KEY), not here.
  LITELLM_BASE_URL: {{ .Values.config.llm.baseUrl | quote }}
  LITELLM_MODEL: {{ .Values.config.llm.model | quote }}
  LITELLM_REASONING_EFFORT: {{ .Values.config.llm.reasoningEffort | default "low" | quote }}
  PUBLIC_URL: {{ .Values.config.publicUrl | quote }}
  DOWNLOAD_TTL_SECONDS: {{ .Values.config.downloadTtlSeconds | quote }}
  GHE_HOST: {{ .Values.config.ghe.host | quote }}
  GHE_ORG: {{ .Values.config.ghe.org | quote }}
  GHE_USER: {{ .Values.config.ghe.user | quote }}
  {{- with .Values.config.email.smtpHost }}
  SMTP_HOST: {{ . | quote }}
  {{- end }}
  SMTP_PORT: {{ .Values.config.email.smtpPort | quote }}
  SMTP_STARTTLS: {{ .Values.config.email.smtpStartTls | quote }}
  REPORT_EMAIL_FROM: {{ .Values.config.email.from | quote }}
  REPORT_EMAIL_TO: {{ .Values.config.email.to | quote }}
