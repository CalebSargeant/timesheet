{{- if .Values.externalSecret.enabled -}}
# Projects the app's secret env vars (DB DSN, ICS URL, GHE PAT, ingest token,
# signing key, SMTP password) from OCI Vault into the Secret the pods consume.
apiVersion: {{ .Values.externalSecret.apiVersion | default "external-secrets.io/v1" }}
kind: ExternalSecret
metadata:
  name: {{ include "gts.fullname" . }}-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gts.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "gts.fullname" . }}-env
    creationPolicy: Owner
    template:
      type: Opaque
  {{- with .Values.externalSecret.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
