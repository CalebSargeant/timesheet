# github-timesheet — web Deployment (reads) + nightly CronJob (writes), sharing
# the firefly CNPG. No SQLite, no PVC: the pod is stateless.

image:
  repository: ghcr.io/magmamoose/github-timesheet
  tag: ""                     # Flux image automation manages the tag
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8000

# The Cloudflare tunnel (infra repo) routes uren.calebsargeant.com -> this Service,
# so no in-cluster Ingress is needed.
ingress:
  enabled: false

# Non-secret runtime config -> ConfigMap.
config:
  tz: Europe/Amsterdam
  # Which calendar collector runs: mcp | ics | graph. "mcp" reads calendar, sent
  # mail and Teams activity over Claude's Microsoft 365 connector, which is what
  # the Power Automate /api/ingest flow was built to push in.
  #
  # Empty keeps the old behaviour (ics, since M365_ICS_URL is set). To switch:
  # put the output of `mcp_client login` in OCI Vault as
  # github-timesheet-m365-mcp-token-json, uncomment M365_MCP_TOKEN_JSON below,
  # then set this to "mcp". In that order — external-secrets syncs `data`
  # all-or-nothing, so naming a vault key that does not exist yet breaks the
  # whole Secret and takes the running service down with it.
  #
  # There is no fallback between sources on failure, deliberately: a silent swap
  # would make a broken connector look like a week with no meetings, and that
  # reconstructs into a plausible, wrong, all-admin sheet.
  m365Source: ""
  # Must be writable: Entra rotates the refresh token on every use, and a
  # read-only path silently replays a spent one until it dies.
  m365McpTokenCache: /tmp/m365-mcp-token.json
  dayStart: "08:30"           # normal start; opens earlier only if a commit/meeting shows it
  # Day length is effort-driven (git-hours + meetings), floored to 8h and capped
  # at 12h in code (MIN_DAY_MINUTES / MAX_DAY_MINUTES); no flat target.
  rotaEnabled: false          # the example sheet's 07:30 "Checks en standby" was a placeholder
  rotaMinutes: 75
  includeAfterHours: false
  # AI label polish via the house LiteLLM proxy, in the nightly refresh only.
  # deepseek-v4-flash is a reasoning model; reasoningEffort=low keeps it ~3.6s/call.
  llm:
    baseUrl: https://litellm.sargeant.co
    model: "deepseek-v4-flash"
    reasoningEffort: "low"
  publicUrl: https://uren.calebsargeant.com
  downloadTtlSeconds: 604800
  ghe:
    host: pinkroccade.ghe.com
    org: samenlevingszaken
    user: sargea50
  email:
    smtpHost: ""
    smtpPort: 587
    smtpStartTls: true
    from: caleb@calebsargeant.com
    to: marc.vergunst@pinkroccade.nl

# Secret env. Prod: projected from OCI Vault by external-secrets. The keys below
# are the env vars the app reads; remoteRef.key is the OCI Vault secret name.
externalSecret:
  enabled: true
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  data:
    - secretKey: DATABASE_URL
      remoteRef: {key: github-timesheet-database-url}
    - secretKey: M365_ICS_URL
      remoteRef: {key: github-timesheet-m365-ics-url}
    # The MCP token cache, verbatim, from `mcp_client login`. A refresh token:
    # standing read access to the mailbox that never re-prompts for MFA.
    # Commented out until the vault entry exists — see config.m365Source.
    # - secretKey: M365_MCP_TOKEN_JSON
    #   remoteRef: {key: github-timesheet-m365-mcp-token-json}
    - secretKey: GHE_TOKEN
      remoteRef: {key: github-timesheet-ghe-token}
    - secretKey: INGEST_TOKEN
      remoteRef: {key: github-timesheet-ingest-token}
    - secretKey: DOWNLOAD_SIGNING_KEY
      remoteRef: {key: github-timesheet-download-signing-key}
    - secretKey: SMTP_PASSWORD
      remoteRef: {key: github-timesheet-smtp-password}
    # optional AI label polish
    - secretKey: LITELLM_API_KEY
      remoteRef: {key: github-timesheet-litellm-api-key}

# Dev-only alternative to externalSecret (avoid in prod).
secrets:
  create: false
  existingSecretName: ""
  data: {}

# Nightly regeneration + email.
cronjob:
  enabled: true
  schedule: "30 18 * * 1-5"   # 18:30 Mon–Fri
  timeZone: Europe/Amsterdam
  email: true                 # pass --email
  concurrencyPolicy: Forbid
  backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

resources:
  requests: {cpu: 25m, memory: 96Mi}
  limits: {cpu: 500m, memory: 256Mi}

readinessProbe: {initialDelaySeconds: 3, periodSeconds: 10}
livenessProbe: {initialDelaySeconds: 10, periodSeconds: 30}

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: ["ALL"]}

nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
