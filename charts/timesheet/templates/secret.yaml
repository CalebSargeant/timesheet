{{- if .Values.secrets.create -}}
# Local-development inline secret. These values land in your Helm release, which
# is not a secret store — in production point secrets.existingSecretName at
# whatever already projects secrets into this namespace.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ts.fullname" . }}-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ts.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end -}}
