# timesheet — a web Deployment (reads) and a scheduled CronJob (writes), sharing
# one PostgreSQL database. The pods are stateless: no PVC, no SQLite.

image:
  repository: ghcr.io/calebsargeant/timesheet
  tag: ""                     # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8000

# Off by default: plenty of clusters front a Service with something other than an
# Ingress (a tunnel, a gateway, a service mesh).
ingress:
  enabled: false

# Non-secret runtime config -> ConfigMap. Secrets go in the Secret below.
config:
  # Where the service is reachable. The OAuth callback is <publicUrl>/auth/callback,
  # and links in delivered messages point here. This MUST be set.
  publicUrl: ""

  # Which GitHub; register the OAuth app on this same host. Handles github.com,
  # an Enterprise Cloud data-residency tenant (acme.ghe.com), and a self-hosted
  # Enterprise Server — the three use different API bases, see the README.
  githubHost: github.com
  githubOauthScopes: "read:user user:email repo read:org"

  # single | allowlist | org | open. `single` means the first account to sign in
  # claims this deployment and every later one is refused — the right default for
  # something that stores delegated mailbox tokens.
  accessPolicy: single
  allowedLogins: ""           # for allowlist: comma-separated GitHub logins
  allowedOrgs: ""             # for org: comma-separated org logins

  # Starting values for a new account. Each person overrides these under Settings.
  locale: en
  tz: UTC
  dayStart: "08:30"
  minDayMinutes: 480
  dayRolloverHour: 5
  rotaEnabled: false
  rotaMinutes: 75
  includeEmail: true
  # Teams messages you SENT, as a signal for the reconstruction. Nothing to do
  # with delivery (see `delivery.chat` below) — this one only reads.
  includeChat: true
  backfillWeeks: 6
  downloadTtlSeconds: 604800

  # How long the refresh job's copy of the in-progress week is served before a
  # page view rebuilds it live. Keep it near `cronjob.schedule`: that is the
  # staleness bound on "this week".
  liveMaxAgeSeconds: 900

  # Must be writable: Entra rotates the refresh token on every use, and a
  # read-only path silently replays a spent one until it dies.
  m365McpTokenCache: /tmp/m365-mcp-token.json

  # Optional AI label polish, in the scheduled refresh only. An empty model means
  # AI is off and the deterministic summariser is used.
  llm:
    baseUrl: ""
    model: ""
    reasoningEffort: "low"

  # Delivery: how a finished week reaches a manager.
  delivery:
    # Teams. Off, and it should stay off unless your tenant grants the Microsoft
    # connector ChatMessage.Send: its delegated permissions are read-only, so on
    # every other tenant this is an option nobody can use, failing with
    # "FORBIDDEN: Missing scope" at the moment somebody presses Send.
    chat: false

  # Mail belongs to the deployment: an account holder gives a recipient, never a
  # mail server's credentials. Secrets (SMTP_PASSWORD, MAILGUN_API_KEY) go in the
  # Secret. Set EITHER the SMTP block or the Mailgun one — Mailgun's API wins if
  # both are set, because configuring it is a deliberate move away from SMTP.
  email:
    from: ""
    smtpHost: ""
    smtpPort: 587
    smtpStartTls: true
    # Mailgun's HTTP API, for clusters where outbound SMTP is blocked. An EU
    # domain answers on https://api.eu.mailgun.net and nowhere else.
    mailgunDomain: ""
    mailgunBaseUrl: ""

# Secret env. Point `existingSecretName` at whatever already projects secrets into
# this namespace (External Secrets, Sealed Secrets, the CSI driver, a hand-made
# Secret); the chart deliberately does not pick one for you. `create: true` with
# inline `data` is for local development only — those values land in your Helm
# release, which is not a secret store.
#
# Keys the app reads:
#   SECRET_KEY                   signs sessions, encrypts stored tokens (REQUIRED)
#   GITHUB_OAUTH_CLIENT_ID       the OAuth app                         (REQUIRED)
#   GITHUB_OAUTH_CLIENT_SECRET                                         (REQUIRED)
#   DATABASE_URL                 PostgreSQL DSN                        (REQUIRED)
#   SMTP_PASSWORD                only if delivering by email over SMTP
#   MAILGUN_API_KEY              only if delivering by email over Mailgun's API
#   LLM_API_KEY                  only if AI label polish is on
secrets:
  create: false
  existingSecretName: ""
  data: {}

# Two scheduled jobs, because they want opposite schedules.
#
# `cronjob` REFRESHES: it rebuilds each account's week with the heavy signals a
# page view cannot afford (reviews, mail, chat) and stores it. It wants to run
# often — that frequency is what makes the live page current — and it sends
# nothing, so running it every quarter of an hour is free of consequences.
#
# `deliverJob` SENDS, once a week, at the end of the working week. Keeping
# delivery out of the frequent job is the whole point of the split: `--send` on
# a */15 schedule is thirty-odd emails to a manager every day.
cronjob:
  enabled: true
  schedule: "*/15 6-20 * * 1-5"   # every 15 min through the working day
  timeZone: UTC
  send: false                     # do not turn this on; use deliverJob
  concurrencyPolicy: Forbid
  backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

deliverJob:
  enabled: true
  # The mail is the week's timesheet, so it goes once, on Friday. Friday and not
  # Monday: `timesheet.run` sends the week containing the day it runs (today's
  # date, whose Monday `collect` starts from), so a Monday run would send the
  # week that has just begun instead of the one just worked.
  schedule: "30 18 * * 5"         # 18:30 Fri
  timeZone: ""                    # defaults to cronjob.timeZone
  concurrencyPolicy: Forbid
  backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

resources:
  requests: {cpu: 25m, memory: 96Mi}
  limits: {cpu: 500m, memory: 256Mi}

readinessProbe: {initialDelaySeconds: 3, periodSeconds: 10}
livenessProbe: {initialDelaySeconds: 10, periodSeconds: 30}

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: ["ALL"]}

nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
