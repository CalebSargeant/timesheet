site_name: timesheet
site_description: Reconstruct a defensible working week from calendar, mail, chat, and GitHub activity.
repo_url: https://github.com/calebsargeant/timesheet
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - navigation.instant
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc: { permalink: true }

plugins:
  - search

nav:
  - Home: index.md
  - API:
      - HTTP API: api.md
      - Pushed ingest: pushed-ingest.md
