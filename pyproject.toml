[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timesheet"
version = "0.2.1"
description = "Reconstruct a working week from calendar, mail, chat and GitHub activity"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Caleb Sargeant" }]
keywords = ["timesheet", "github", "microsoft365", "calendar", "time-tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/calebsargeant/timesheet"
Issues = "https://github.com/calebsargeant/timesheet/issues"

[project.optional-dependencies]
# The self-hosted web service. The reconstruction core needs none of these:
# `timesheet.demo` runs on a bare install with openpyxl and nothing else.
service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",      # FastAPI needs this to read a posted form
    "cryptography>=42",             # AES-GCM for stored Microsoft/GitHub tokens
    "icalendar>=5.0",               # published-ICS calendar path
    "recurring-ical-events>=2.2",   # expand recurring events in an ICS feed
    "psycopg[binary]>=3.1",         # PostgreSQL store
]
# Only for the device-code Microsoft Graph collector, which most tenants block.
graph = ["msal>=1.28"]
# Ruff is pinned to a floor, not left open: each release turns on more default
# rules, so an older local copy passes what CI then rejects.
#
# Starlette's TestClient needs an HTTP client, and which one moved: older
# releases import `httpx`, newer ones `httpx2`. Both are listed because which
# starlette you resolve decides it, and a contributor pinned to an older FastAPI
# must not find the test suite refusing to collect.
dev = [
    "pytest>=8", "pytest-cov>=5", "ruff>=0.16",
    "httpx>=0.27", "httpx2>=2.0",
]

[project.scripts]
timesheet-demo = "timesheet.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# Selected explicitly rather than left on the defaults: each ruff release turns
# more rules on, and a lint set that changes underneath you fails CI on a commit
# that touched none of it.
[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # import order
    "B",             # bugbear
    "BLE",           # blind `except Exception` — every one here is argued for in a comment
    "S",             # bandit: this service holds delegated mailbox tokens
    "C4", "UP", "SIM", "PIE", "G", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # assert IS the test
    "S105", "S106",  # "tokens" in fixtures are fake by construction
    "SLF001", # reaching into internals is how you test them
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=timesheet --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["src/timesheet"]
omit = ["*/demo.py"]
